<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#FAF6F0">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet" />

    <!-- LCP Image Preloads -->
    <link rel="preload" as="image" href="/images/hero_bg_mobile.jpg" media="(max-width: 768px)" />
    <link rel="preload" as="image" href="/images/hero_bg.png" media="(min-width: 769px)" />

    <!-- SEO -->
    <title>Perlipimpon — Créatrice de bijoux fantaisie, énergies et pierres naturelles</title>
    <meta name="description" content="Perlipimpon vous propose des bijoux artisanaux faits main, inspirés par la lune et les énergies. Créations uniques en pierres naturelles : pierre de lune, perles, améthyste. Fabrication artisanale." />
    <meta name="keywords" content="bijoux artisanaux, bijoux fantaisie, lithothérapie, pierre de lune, lune, énergie, perles, fait main, créatrice bijoux" />

    <!-- Open Graph -->
    <meta property="og:title" content="Perlipimpon — Créatrice de bijoux énergétiques & fantaisie" />
    <meta property="og:description" content="Découvrez une collection unique de bijoux artisanaux imprégnés d'énergies célestes. Fait main." />
    <meta property="og:type" content="website" />
  </head>
  <body style="margin: 0; background-color: #FAF6F0;">

    <!-- INVISIBLE SVG LOGO REMAINS IN BODY FOR CACHING -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
      <defs>
        <clipPath id="logo-mask">
          <ellipse cx="50" cy="50" rx="40" ry="30" />
        </clipPath>
      </defs>
    </svg>

    <div id="root">
      <!-- FAST FIRST CONTENTFUL PAINT (FCP) SKELETON -->
      <style>
        .fcp-loader {
          height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: #FAF6F0;
          color: #D4AF37;
          font-family: 'Playfair Display', serif;
          font-style: italic;
          font-size: 24px;
        }
      </style>
      <div class="fcp-loader">Perlipimpon...</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
